  p { font-size:14px; color:#3E5B4C; margin-bottom:26px; line-height:1.5; }
  .cta {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--verde); color:#fff; font-weight:800; font-size:17px;
    padding:16px 28px; border-radius:14px; border:none; width:100%;
    box-shadow:0 8px 22px rgba(37,211,102,.35); cursor:pointer;
    text-decoration:none;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow:0 8px 22px rgba(37,211,102,.35); }
    50% { box-shadow:0 8px 30px rgba(37,211,102,.6); }
  }
  .cta:active { transform:scale(.98); }
  .fine { font-size:12px; color:#7C9186; margin-top:16px; }

  .foto-wrap { position:relative; width:100%; border-radius:18px; overflow:visible;
    margin-bottom:26px; box-shadow:0 10px 26px rgba(11,46,28,.18); }
  /* aspect-ratio bate com a foto original (1086x1448 = 3:4) — sem crop, mostra
     a foto inteira em vez de cortar cabeça/queixo com object-fit:cover 1:1 */
  .foto-wrap img { width:100%; display:block; aspect-ratio:3/4; object-fit:cover;
    border-radius:18px; }
  /* Selo e badge agora "flutuam" como sticker/notificação por cima da foto,

  .selo-whats svg { width:18px; height:18px; flex-shrink:0; }
  .badge-canto { position:absolute; top:-12px; right:-8px; background:#fff; border-radius:50%;
    width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.25); border:3px solid #fff; transform:rotate(8deg); }

<script>
  var dest = 'https://chat.whatsapp.com/HxzlNHAlZsQBWUh1aQA8Mm';
  var leadFired = false;

  function fireLeadAndGo(target) {
    if (!leadFired) {
      leadFired = true;
      if (typeof fbq === 'function') {
        fbq('track', 'Lead', {}, { eventID: 'lead-' + Date.now() });
      }
    }
    var finalDest = target;
    if (isInAppBrowser && isAndroid) {
      var withoutScheme = finalDest.replace(/^https?:\/\//, '');
      finalDest = 'intent://' + withoutScheme + '#Intent;scheme=https;package=com.whatsapp;S.browser_fallback_url=' + encodeURIComponent(finalDest) + ';end';
    }
    var novaAba = window.open(finalDest, '_blank');
    if (!novaAba) window.location.href = finalDest;
  }


  var ua = navigator.userAgent || '';
  var isInAppBrowser = /FBAN|FBAV|FB_IAB|Instagram/i.test(ua);
  var isAndroid = /Android/i.test(ua);

  if (isInAppBrowser) {
    var banner = document.createElement('div');
    banner.className = 'iab-banner';
    banner.innerHTML = '⚠️ Pra abrir o WhatsApp certinho, toque nos <b>⋮</b> (ou no ícone de compartilhar) no topo e escolha <b>"Abrir no navegador"</b>.';
    document.body.insertBefore(banner, document.body.firstChild);
  }

  document.getElementById('btnEntrar').addEventListener('click', function(){
    fireLeadAndGo(dest);
  });
</script>
