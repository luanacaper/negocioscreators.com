/* Exemplo de tour no padrão do site modelo 2: fundo grafite, dourado acobreado, bordô das cadeiras.
   Layout: a cena ocupa a tela; título e salas ficam em vidro escuro por cima. */
:root {
  --bg: #09090B; --vidro: rgba(9, 9, 11, .62); --ink: #F7F4EE; --muted: #B9BCC4;
  --ouro: #C9955E; --ouro-hi: #E8C08C; --couro: #9E4A3C; --linha: rgba(232, 192, 140, .28);
  --display: "EB Garamond", Georgia, serif; --caps: "Cinzel", Georgia, serif; --body: Inter, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; }
#tour { position: fixed; inset: 0; }
.pnlm-container { background: var(--bg) !important; font-family: var(--body) !important; }
.pnlm-load-box { background: var(--vidro) !important; border-radius: 14px; font-family: var(--body); }
.topo { position: fixed; z-index: 5; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(9, 9, 11, .8), transparent); pointer-events: none; }
.marca { pointer-events: auto; }
.selo { font-family: var(--caps); font-weight: 600; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--ouro-hi); display: flex; align-items: center; gap: 9px; margin: 0 0 6px; }
.selo::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--couro); }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(26px, 4vw, 40px); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 em { color: var(--ouro-hi); }
.aviso { pointer-events: auto; max-width: 300px; font-size: 12.5px; line-height: 1.5; color: var(--muted); background: var(--vidro); border: 1px solid var(--linha);
  border-radius: 14px; padding: 10px 14px; margin: 0; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.aviso b { color: var(--ink); font-weight: 600; }
.base { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 50px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(0deg, rgba(9, 9, 11, .85), transparent); pointer-events: none; }
.dica { margin: 0; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: opacity .6s; text-align: center; }
.dica svg { width: 18px; height: 18px; flex: none; stroke: var(--ouro-hi); fill: none; stroke-width: 1.6; }
.salas { pointer-events: auto; display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding: 2px; scrollbar-width: none; }
.salas::-webkit-scrollbar { display: none; }
.sala { flex: none; font: 600 13px/1 var(--body); color: var(--ink); background: var(--vidro); border: 1px solid var(--linha); border-radius: 999px;
  padding: 11px 16px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background .3s, border-color .3s, color .3s; }
.sala:hover { border-color: var(--ouro-hi); }
.sala:focus-visible { outline: 2px solid var(--ouro-hi); outline-offset: 2px; }
.sala[aria-pressed="true"] { background: linear-gradient(135deg, #B87D4B, #9A6236); border-color: transparent; color: #fff; }
/* pontos de passagem e de informação dentro da cena */
.ponto { width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
  background: rgba(9, 9, 11, .55); border: 1.5px solid var(--ouro-hi); animation: pulsa 2.4s infinite; }
.ponto svg { width: 18px; height: 18px; stroke: var(--ouro-hi); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ponto .rotulo { position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%); white-space: nowrap; font: 600 12.5px/1 var(--body); color: var(--ink);
  background: var(--vidro); border: 1px solid var(--linha); border-radius: 999px; padding: 8px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none; }
.ponto.info { border-color: var(--couro); }
.ponto.info svg { stroke: #fff; }
.ponto.info .rotulo { white-space: normal; width: 210px; text-align: left; line-height: 1.45; font-weight: 400; border-radius: 12px; }
.ponto.info .rotulo b { display: block; font-family: var(--display); font-size: 17px; font-weight: 600; margin-bottom: 2px; }
@keyframes pulsa { 0% { box-shadow: 0 0 0 0 rgba(232, 192, 140, .5); } 70% { box-shadow: 0 0 0 14px rgba(232, 192, 140, 0); } 100% { box-shadow: 0 0 0 0 rgba(232, 192, 140, 0); } }
@media (max-width: 640px) {
  .topo { flex-direction: column; gap: 10px; }
  .aviso { max-width: none; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { .ponto { animation: none; } }

<body>
<div id="tour" role="application" aria-label="Tour pelo escritório Stabile Advogados"></div>

<header class="topo">
  <div class="marca">
    <p class="selo">Exemplo de tour</p>
    <h1>Conheça o escritório <em>por dentro</em></h1>
  </div>
  <p class="aviso"><b>Prévia montada com fotos comuns do escritório.</b> Com fotos 360° de cada sala, a visão gira por inteiro, inclusive teto e chão.</p>
</header>

<footer class="base">
  <p class="dica" id="dica"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-1.5a1.5 1.5 0 0 1 3 0V12m0-.5a1.5 1.5 0 0 1 3 0V16a5 5 0 0 1-5 5h-1.5a5 5 0 0 1-4.2-2.3L4.6 15a1.5 1.5 0 0 1 2.4-1.8L8 14.5"/></svg>Arraste para olhar em volta e toque nos pontos dourados</p>
  <nav class="salas" aria-label="Salas">
    <button class="sala" id="b-recepcao" data-cena="recepcao" aria-pressed="true">Recepção</button>
    <button class="sala" id="b-reunioes" data-cena="reunioes" aria-pressed="false">Sala de reuniões</button>
    <button class="sala" id="b-mesa" data-cena="mesa" aria-pressed="false">Mesa de reuniões</button>
  </nav>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<script>
(() => {
  const ICO = {
    seta: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    info: '<svg viewBox="0 0 24 24"><path d="M12 11v6M12 7.5v.01"/></svg>'
  };
  function ponto(div, args) {
    div.classList.add('ponto');
    if (args.info) div.classList.add('info');
    div.innerHTML = (args.info ? ICO.info : ICO.seta) + '<span class="rotulo">' + args.html + '</span>';
  }
  const passa = (yaw, pitch, cena, txt) => ({ pitch, yaw, type: 'scene', sceneId: cena, cssClass: 'p', createTooltipFunc: ponto, createTooltipArgs: { html: txt } });
  const info = (yaw, pitch, html) => ({ pitch, yaw, type: 'info', cssClass: 'p', createTooltipFunc: ponto, createTooltipArgs: { html, info: true } });
  /* fotos comuns entram como panorama parcial: o ângulo de visão segue o formato de cada foto */
  const parcial = (img, w, h, haov, extra) => Object.assign({ type: 'equirectangular', panorama: img, haov, vaov: haov * h / w, vOffset: 0,
    hfov: haov * .78, minHfov: haov * .4, maxHfov: haov * .9, yaw: 0, pitch: 0 }, extra);
  const viewer = pannellum.viewer('tour', {
    default: { firstScene: 'recepcao', sceneFadeDuration: 900, autoLoad: true, showControls: false, mouseZoom: true, keyboardZoom: true },
    scenes: {
      recepcao: parcial('recepcao.jpg', 1400, 1050, 90, { hotSpots: [
        passa(-24, -6, 'reunioes', 'Ir para a sala de reuniões'),
        info(30, -10, '<b>Recepção</b>Mármore Nero, ripado de madeira e a identidade Stabile no painel.')
      ] }),
      reunioes: parcial('reunioes.jpg', 1672, 941, 110, { yaw: -8, hotSpots: [
        info(-44, 2, '<b>Dr. Henrique Stabile</b>Sócio fundador · OAB/GO 34.362'),
        passa(30, -14, 'mesa', 'Ver a mesa de perto'),
        passa(46, 6, 'recepcao', 'Voltar à recepção')
      ] }),
      mesa: parcial('mesa.jpg', 1050, 1400, 62, { hfov: 52, pitch: -4, hotSpots: [
        info(14, 4, '<b>Sala de reuniões</b>Mesa em quartzito e cadeiras em couro, onde acontecem as conversas sobre o caso.'),
        passa(-20, -10, 'reunioes', 'Voltar à sala')
      ] })
    }
  });
  const botoes = [...document.querySelectorAll('.sala')];
  const marcar = (id) => botoes.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cena === id)));
  let parado = matchMedia('(prefers-reduced-motion: reduce)').matches, lado = 1, timer = null;
  botoes.forEach((b) => b.addEventListener('click', () => { parar(); viewer.loadScene(b.dataset.cena); }));
  viewer.on('scenechange', (id) => marcar(id));
  /* passeio automático lento, de um lado ao outro, até a pessoa mexer */
  function passear() {
    clearTimeout(timer);
    if (parado) return;
    const c = viewer.getConfig(), lim = Math.max(4, (c.haov - viewer.getHfov()) / 2 - 1);
    viewer.setYaw(lado * lim, 7000);
    lado = -lado;
    timer = setTimeout(passear, 7400);
  }
  function parar() { parado = true; clearTimeout(timer); document.getElementById('dica').style.opacity = '.4'; }
  ['mousedown', 'touchstart', 'wheel', 'keydown'].forEach((ev) => document.getElementById('tour').addEventListener(ev, parar, { passive: true }));
  viewer.on('load', () => setTimeout(passear, 900));
})();
</script>

</body>
</html>
